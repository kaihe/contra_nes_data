[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contra-nes-data"
version = "0.1.0"
description = "Contra NES event/reward tooling and game-trace analysis"
requires-python = ">=3.10"

# src/ layout: the top-level packages env/, agent/, util/ live under src/, so
# after `pip install -e .` they import cleanly as `env.*`, `agent.*`, `util.*`
# (no `src.` prefix).
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Ship action configs plus the reproducible spread-gun and boss start-state banks.
[tool.setuptools.package-data]
agent = ["*.yaml", "priors/*.yaml", "states/*/*.state", "states/*/*.yaml"]
