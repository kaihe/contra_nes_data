# Level 2 is an indoor base: movement is mostly up/down/left/right and firing
# wall cores. Keep the full baseline vocabulary, but restore the tuned action
# prior used by the working contra_agent search.
#
# Bit order: [B, NULL, SELECT, START, UP, DOWN, LEFT, RIGHT, A]
# (B = fire, A = jump).
skip: 3
actions:
  _:   [0, 0, 0, 0, 0, 0, 0, 0, 0]
  J:   [0, 0, 0, 0, 0, 0, 0, 0, 1]
  F:   [1, 0, 0, 0, 0, 0, 0, 0, 0]
  L:   [0, 0, 0, 0, 0, 0, 1, 0, 0]
  LJ:  [0, 0, 0, 0, 0, 0, 1, 0, 1]
  LF:  [1, 0, 0, 0, 0, 0, 1, 0, 0]
  R:   [0, 0, 0, 0, 0, 0, 0, 1, 0]
  RJ:  [0, 0, 0, 0, 0, 0, 0, 1, 1]
  RF:  [1, 0, 0, 0, 0, 0, 0, 1, 0]
  U:   [0, 0, 0, 0, 1, 0, 0, 0, 0]
  UJ:  [0, 0, 0, 0, 1, 0, 0, 0, 1]
  UF:  [1, 0, 0, 0, 1, 0, 0, 0, 0]
  D:   [0, 0, 0, 0, 0, 1, 0, 0, 0]
  DJ:  [0, 0, 0, 0, 0, 1, 0, 0, 1]
  DF:  [1, 0, 0, 0, 0, 1, 0, 0, 0]
  UL:  [0, 0, 0, 0, 1, 0, 1, 0, 0]
  ULJ: [0, 0, 0, 0, 1, 0, 1, 0, 1]
  ULF: [1, 0, 0, 0, 1, 0, 1, 0, 0]
  UR:  [0, 0, 0, 0, 1, 0, 0, 1, 0]
  URJ: [0, 0, 0, 0, 1, 0, 0, 1, 1]
  URF: [1, 0, 0, 0, 1, 0, 0, 1, 0]

# Indoor advancement rewards arrive in bursts around core/door transitions.
# Small button costs act only as tie-breakers; the old -0.3 defaults can make
# useful firing score below idling over a 48-step lookahead.
costs:
  F: -0.02
  J: -0.02

prior:
  traces: "game_trace/human_recordings/Level2/*.npz"
  mode: bigram
  smooth: 0.0
